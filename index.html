<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Video Downloader</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b, var(--bg-dark) 70%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.6s var(--ease);
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px -10px var(--primary-glow);
        }

        .logo-box svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px 24px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s var(--ease) 0.1s backwards;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="url"] {
            width: 100%;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 18px 100px 18px 18px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s var(--ease);
        }

        input[type="url"]:focus {
            background: #252f40;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .paste-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .paste-btn:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .paste-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .btn-download {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            background: #2563eb;
        }

        .btn-download:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-download:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .platform-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            opacity: 0.4;
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: white;
            transition: fill 0.3s, transform 0.3s;
        }

        .icon-svg:hover {
            fill: var(--primary);
            transform: scale(1.15);
            opacity: 1;
        }

        #result {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.4s var(--ease);
        }

        .meta-box {
            display: flex;
            gap: 15px;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .thumb {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
        }

        .info h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .dl-link {
            display: block;
            width: 100%;
            background: var(--bg-input);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dl-link:hover {
            border-color: var(--primary);
            background: #252f40;
        }

        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 5px;
            margin-right: 8px;
            font-weight: 700;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        /* PERUBAAN DIMULAI DI SINI */
        .toast {
            position: fixed;
            /* Dipindah dari bawah ke atas */
            top: 20px; 
            left: 50%;
            /* Sesuaikan transformasi agar animasi slide down dari atas */
            transform: translateX(-50%) translateY(-20px);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--ease);
            /* Z-index ditingkatkan agar selalu di atas */
            z-index: 100; 
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); /* Tambah efek blur modern */
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { border-color: #ef4444; color: #fca5a5; background: rgba(239, 68, 68, 0.9); }
        .toast.success { border-color: #10b981; color: #fff; background: rgba(16, 185, 129, 0.9); }
        /* PERUBEAAN BERAKHIR DI SINI */

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 400px) {
            h1 { font-size: 1.5rem; }
            .card { padding: 24px 16px; }
            input[type="url"] { padding: 16px 90px 16px 16px; }
            /* Sesuaikan padding toast di layar kecil */
            .toast {
                left: 20px;
                right: 20px;
                transform: none;
                width: auto;
                text-align: center;
                top: 10px;
            }
            .toast.visible {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
            </div>
            <h1>Universal Downloader</h1>
            <p class="subtitle">Simpan video tanpa watermark dari TikTok, IG, & Facebook.</p>
        </div>

        <div class="card">
            <form id="dlForm">
                <div class="input-wrap">
                    <input type="url" id="urlInput" placeholder="Tempel link video di sini..." required autocomplete="off">
                    <button type="button" id="pasteBtn" class="paste-btn">TEMPEL</button>
                </div>
                <button type="submit" id="dlBtn" class="btn-download">
                    <span>Download Video</span>
                    <svg class="btn-icon" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="platform-row">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toastMsg">Pesan</span>
    </div>

    <script>
        const API_URL = 'https://etzy-api.vercel.app/downloader/blackhole';
        const form = document.getElementById('dlForm');
        const input = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const dlBtn = document.getElementById('dlBtn');
        const btnText = dlBtn.querySelector('span');
        const loader = dlBtn.querySelector('.loader');
        const icon = dlBtn.querySelector('.btn-icon');
        const resultDiv = document.getElementById('result');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(msg, type) {
            toastMsg.innerText = msg;
            toast.className = 'toast ' + type + ' visible';
            setTimeout(() => {
                toast.className = 'toast'; // Reset class
            }, 3000);
        }

        function toggleLoad(isLoading) {
            if (isLoading) {
                dlBtn.disabled = true;
                btnText.style.display = 'none';
                icon.style.display = 'none';
                loader.style.display = 'block';
                resultDiv.style.display = 'none';
            } else {
                dlBtn.disabled = false;
                btnText.style.display = 'block';
                icon.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                input.value = text;
                showToast('Link berhasil ditempel', 'success');
            } catch (e) {
                showToast('Gagal akses clipboard', 'error');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = input.value.trim();

            if (!url) return showToast('URL tidak boleh kosong', 'error');
            if (!url.startsWith('http')) return showToast('Format URL salah', 'error');

            toggleLoad(true);

            try {
                const res = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();

                if (data.status && data.result?.success) {
                    const links = data.result.download_links;
                    const title = data.result.title || "Video Tanpa Judul";
                    const seed = Math.random().toString(36).substring(7);
                    const thumb = `https://picsum.photos/seed/${seed}/200/200.jpg`;

                    let html = `
                        <div class="meta-box">
                            <img src="${thumb}" class="thumb" alt="thumb">
                            <div class="info">
                                <h3>${title}</h3>
                                <p>Universal Downloader</p>
                            </div>
                        </div>
                        <div>
                    `;

                    if (links && links.length > 0) {
                        links.forEach((link, i) => {
                            const badge = i === 0 ? '<span class="badge">HD</span>' : '';
                            html += `
                                <a href="${link}" target="_blank" class="dl-link">
                                    <span>${badge}Server ${i + 1}</span>
                                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                </a>
                            `;
                        });
                    } else {
                        html += `<p style="text-align:center; color:#94a3b8;">Gagal mendapatkan link.</p>`;
                    }

                    html += `</div>`;
                    resultDiv.innerHTML = html;
                    resultDiv.style.display = 'block';
                    showToast('Video ditemukan!', 'success');

                } else {
                    showToast('Gagal memproses video', 'error');
                }

            } catch (err) {
                console.error(err);
                showToast('Terjadi kesalahan koneksi', 'error');
            } finally {
                toggleLoad(false);
            }
        });
    </script>
</body>
</html>
